<style>
:root{color-scheme:light;--blue:#155bd7;--ink:#123252;--muted:#53677e;--line:#dce5ef;--paper:#f4f7fc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:750;font-size:23px}.tag{font-size:13px;color:var(--muted)}h1{font-size:36px;line-height:1.3;margin:30px 0 12px;letter-spacing:-1px}.lead{color:var(--muted);max-width:760px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:26px}nav{min-width:0;display:flex;flex-direction:column;gap:10px}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);background:white;text-align:left}nav button{display:flex;align-items:center;gap:12px}nav button[aria-current=step]{border-color:var(--blue);background:#eaf1ff;color:#104cba}nav span{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;flex-shrink:0}.confirmed span{background:#dcebe2}article{min-width:0;background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.diagram{padding:20px 24px 10px;background:#eef4ff}.diagram svg{display:block;width:100%;height:auto}.diagram p{margin:4px 0;font-size:12px;color:var(--muted)}.content{padding:24px 28px}h2{font-size:25px;line-height:1.4;margin:0 0 10px}.eyebrow{color:var(--blue);font-size:13px;letter-spacing:1px;font-weight:650}.where{padding:12px 16px;border-radius:10px;background:#eef4ff;margin:18px 0}ol{padding-left:24px}li{padding-left:4px;margin:10px 0}.expected{border-left:3px solid var(--blue);padding:2px 0 2px 16px;margin:20px 0}.expected p{margin:4px 0}.note{color:var(--muted);font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.primary{background:var(--blue);border-color:var(--blue);color:white}.status{font-size:13px;color:var(--muted);margin:18px 0 0}footer{margin-top:28px;font-size:13px;color:var(--muted)}a{color:#174fb3;text-underline-offset:3px}:focus-visible{outline:3px solid #986b00;outline-offset:4px}code{font-size:.9em;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:720px){main{padding:18px}header{align-items:flex-start;flex-direction:column;gap:4px}h1{font-size:29px}.layout{grid-template-columns:minmax(0,1fr);gap:16px}nav{flex-direction:row;overflow:auto;padding-bottom:5px}nav button{min-width:145px;padding:10px;font-size:14px}.content{padding:20px}.diagram{padding:14px 10px}.actions button{width:100%}}@media print{nav,.actions{display:none}.layout{display:block}main{padding:0}article{break-inside:avoid}}

<body><main>
<header><div class="brand">落地 · luodi</div><div class="tag">配置中的图文步骤 · 可离线打开</div></header>
<h1>只做当前这一步。</h1>
<p class="lead">Agent 负责检查与执行；你只处理当前需要参与的操作。先看清在哪台电脑、哪个窗口，再继续。此页是操作示意，不是远程控制页面。</p>
<div class="layout"><nav aria-label="配置步骤">
<button data-step="ssh"><span>1</span>连接 Mac</button><button data-step="network"><span>2</span>确认网络</button><button data-step="install"><span>3</span>准备应用</button><button data-step="model"><span>4</span>配置模型</button><button data-step="verify"><span>5</span>验证与交接</button>
</nav><article aria-labelledby="title"><div class="diagram"><div id="drawing"></div><p>原创操作示意 · 不是真实截图，按钮名称以当前版本为准</p></div><div class="content">
<div class="eyebrow" id="phase"></div><h2 id="title"></h2><div class="where" id="where"></div><ol id="steps"></ol>
<div class="expected"><p><strong>怎样算完成</strong></p><p id="expected"></p></div><p class="note" id="note"></p>
<div class="actions"><button id="confirm" class="primary">标记用户确认，继续下一步</button><button id="next">先看下一步</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p></div></article></div>
<footer>此页不接收密码、API Key 或订阅，不连接电脑，不安装程序。标记只记录本页的人工进度，刷新后清空，不能代替工具验证。<br>
<a href="guided-setup.md">Agent 引导规则</a> · <a href="dsh.md">DSH 接续说明</a> · <a href="https://www.deepseek.com/en/harness/">DeepSeek 官方 Harness</a></footer>
</main><script>
(()=>{'use strict';
const cards=[
 {id:'ssh',phase:'01 / 连接',title:'密码在你眼前的 SSH 窗口输入。',where:'操作位置：控制端电脑，也就是你正在与 Agent 对话的这台电脑。',steps:['目标 Mac 已打开远程登录，且地址、账户已经提供时，Agent 先复用现有连接；需要登录时，在控制端打开可见的原生 SSH 终端。','先核对主机指纹。看到 Password: 后，输入目标 Mac 的登录密码并按回车；输入通常不显示字符。','保持这个窗口打开。Agent 认证后检查目标账户、系统和芯片，再继续。'],expected:'工具确认已认证且目标身份匹配。窗口打开、端口可达和用户输入完密码，都不能单独证明已连接。',note:'不要把密码发到聊天或此页。控制端确实没有可交互入口，或目标未开启远程登录时，才转到目标 Mac 完成必要的一步。',left:'控制端 · 原生 SSH 终端',middle:'原生 SSH',right:'目标 Mac',line1:'Password: ●●●●●●',line2:'你在这个窗口输入',right1:'远程登录已开启',right2:'连接后由工具核对身份'},
 {id:'network',phase:'02 / 网络',title:'先确认实际能联网。',where:'操作位置：目标 Mac 的 Clash Verge 或你已选用的网络客户端。',steps:['优先复用已安装的网络工具；需要订阅时，只在目标客户端中导入。','打开系统代理，保持客户端运行。Agent 核对当前使用的网络接口和实际代理设置。','由工具测试所需服务。浏览器和终端分别检查，不能只根据一个开关判断。'],expected:'所需端点的连通测试通过，且目标应用实际使用的网络路径可用。',note:'不要发送订阅或显示节点凭据的截图。系统代理、TUN 与终端代理是不同配置，按当前需要处理。',left:'目标 Mac · 网络客户端',middle:'实际测试',right:'所需服务',line1:'系统代理  开启',line2:'订阅只留在客户端',right1:'浏览器 / 终端',right2:'分别检查实际连通'},
 {id:'install',phase:'03 / 应用',title:'已安装的直接接着用。',where:'操作位置：目标电脑。下载、校验和安装由已授权的工具执行。',steps:['Agent 先列出已有版本与真实位置，按你选择的用途补缺口。Chrome、ChatGPT、Codex、DSH、OpenClaw 都按需选择。','当前下载展示已下载量、总量和状态；网络中断先保留进度，恢复后重新校验完整性。','安装后给出能打开的入口：应用、快捷方式或命令。桌面应用和 CLI 分别核对。'],expected:'实际版本和安装位置可核对；来源与完整性检查通过；你能找到打开入口。',note:'DSH 桌面版已安装但终端找不到 dsh，不等于没有安装，不要因此重复安装或覆盖配置。',left:'目标电脑 · 已有环境',middle:'只补缺口',right:'可用入口',line1:'检查 → 下载 → 校验',line2:'中断后保留进度',right1:'应用 / 双击启动',right2:'版本与位置已核对'},
 {id:'model',phase:'04 / 模型',title:'Key 在目标应用里自己填。',where:'操作位置：目标电脑的 DSH；其他 Agent 使用各自的官方配置入口。',steps:['DSH Web：打开 Settings → Models（设置 → 模型），在应用里输入 DeepSeek API Key 并保存。实际版本界面不同，以当前界面为准。','如果你已经配好，直接告诉 Agent“已配置”；保留现有设置，不用再次填写或发送 Key。','若模型稍后再连，可以直接跳过并记录暂缓。DSH、Codex、OpenClaw 的模型配置分别检查。'],expected:'你确认完成后，记录“用户已配置，实际调用待验证”；只有真实测试成功才升级为模型可用。',note:'此页没有 Key 输入框。DSH Web 还需选择工作区；输入框不可用不一定是 Key 有问题。',left:'目标电脑 · DSH',middle:'本机保存',right:'状态记录',line1:'设置 → 模型',line2:'API Key 仅在应用填写',right1:'用户已配置',right2:'真实调用另行验证'},
 {id:'verify',phase:'05 / 验证',title:'让你能自己继续用。',where:'操作位置：目标电脑的实际应用；交接记录只保存在本次私有工作目录。',steps:['核对应用启动、代理、后台服务和 Skill 发现状态。分别记录工具观察与用户确认。','模型已连接且测试已获授权时，用空白工作区和不含私人数据的小任务验证；没有结果就保留待验证。','留下版本、启动入口、未完成项和恢复办法。收尾关闭本次临时连接；仅撤销本次新增的临时授权。'],expected:'每项都有证据或明确缺口；下一次对话知道从哪里接续。用户中途安装或配置的内容也已更新。',note:'安装完成、Skill 被发现、模型调用通过是不同结果。不要用此页勾选推断任何一个结果。',left:'实际程序 · 小任务',middle:'证据分层',right:'私有交接',line1:'安装 / 发现 / 调用',line2:'分别记录真实结果',right1:'版本 · 入口 · 待办',right2:'关闭临时连接'}
];
const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-step]')],confirmed=new Set();let current=0;
function textSVG(x,y,value,size=17,color='#123252'){const el=document.createElementNS('http://www.w3.org/2000/svg','text');el.setAttribute('x',x);el.setAttribute('y',y);el.setAttribute('fill',color);el.setAttribute('font-size',size);el.textContent=value;return el;}
function render(){const c=cards[current];$('phase').textContent=c.phase;$('title').textContent=c.title;$('where').textContent=c.where;$('expected').textContent=c.expected;$('note').textContent=c.note;$('steps').replaceChildren(...c.steps.map(s=>{const li=document.createElement('li');li.textContent=s;return li;}));
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const narrow=window.matchMedia('(max-width:720px)').matches;svg.setAttribute('viewBox',narrow?'0 0 350 370':'0 0 700 230');svg.setAttribute('role','img');svg.setAttribute('aria-label',c.left+' → '+c.middle+' → '+c.right);
const title=document.createElementNS(svg.namespaceURI,'title');title.textContent=c.left+' 与 '+c.right+' 的操作分工';svg.append(title);
for(const [x,y,w,h] of (narrow?[[10,15,330,140],[10,215,330,140]]:[[10,35,345,165],[465,35,225,165]])){const r=document.createElementNS(svg.namespaceURI,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,rx:13,fill:'white',stroke:'#b9cce8'}))r.setAttribute(k,v);svg.append(r);}
if(narrow)svg.append(textSVG(26,45,c.left,17,'#155bd7'),textSVG(26,85,c.line1,21),textSVG(26,120,c.line2,16,'#53677e'),textSVG(26,245,c.right,17,'#155bd7'),textSVG(26,280,c.right1,18),textSVG(26,315,c.right2,16,'#53677e'),textSVG(190,192,c.middle,15,'#155bd7'),textSVG(160,197,'↓',32,'#155bd7'));else svg.append(textSVG(28,67,c.left,17,'#155bd7'),textSVG(28,117,c.line1,21),textSVG(28,158,c.line2,16,'#53677e'),textSVG(483,67,c.right,17,'#155bd7'),textSVG(483,117,c.right1,18),textSVG(483,158,c.right2,15,'#53677e'),textSVG(366,93,c.middle,14,'#155bd7'),textSVG(380,139,'→',36,'#155bd7'));
$('drawing').replaceChildren(svg);buttons.forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');b.classList.toggle('confirmed',confirmed.has(cards[i].id));});$('next').disabled=current===cards.length-1;$('confirm').textContent=current===cards.length-1?'标记用户已确认交接':'标记用户确认，继续下一步';$('status').textContent='本页用户确认 '+confirmed.size+' / 5 项 · 实际执行结果以 Agent 的工具检查为准。';}
function choose(i){current=i;location.hash=cards[i].id;render();}
buttons.forEach((b,i)=>b.addEventListener('click',()=>choose(i)));$('next').addEventListener('click',()=>{if(current<cards.length-1)choose(current+1);});$('confirm').addEventListener('click',()=>{confirmed.add(cards[current].id);if(current<cards.length-1)choose(current+1);else render();});window.addEventListener('hashchange',()=>{const i=cards.findIndex(c=>c.id===location.hash.slice(1));if(i>=0){current=i;render();}});const i=cards.findIndex(c=>c.id===location.hash.slice(1));if(i>=0)current=i;render();
window.addEventListener('resize',render);})();
</script></body></html>
